[build]
  publish = "website"
  command = ""

[[redirects]]
  from = "/docs"
  to = "/docs/installation.html"
  status = 302

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
